name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    # macos-14 ships Swift 5.10, whose stricter capture checks reject the app's
    # `Task { @MainActor in self?... }` callbacks; Xcode 16 (Swift 6) is required.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.mod

      - name: Toolchain versions
        run: swift --version && go version

      - name: Swift tests
        working-directory: app
        run: swift test

      - name: Go bridge tests
        working-directory: bridge
        run: go test ./...

      - name: Python installer tests
        run: python3 -m unittest scripts/test_install_hooks.py

      - name: Lint OpenCode plugin
        run: node --check scripts/atoll-opencode.js
