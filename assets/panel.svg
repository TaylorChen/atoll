<svg width="620" height="440" viewBox="0 0 620 440" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Atoll 灵动岛面板示意">
  <title>Atoll 灵动岛面板</title>
  <rect width="620" height="440" fill="#161618"/>
  <g transform="translate(90,20)">
    <rect x="0" y="0" width="440" height="400" rx="18" fill="#0d0d0f"/>

    <g transform="translate(16,16)">
      <circle cx="7" cy="7" r="7" fill="#E86A4B"/>
      <text x="22" y="12" fill="#c9c9cd" font-size="12" font-weight="600">Atoll</text>
      <g fill="#6a6a6e" transform="translate(360,0)">
        <rect x="0" y="2" width="12" height="12" rx="2" fill="none" stroke="#6a6a6e" stroke-width="1.2"/>
        <path d="M28 3 a4 4 0 0 1 0 8 M24 4 l-4 3 h-3 v4 h3 l4 3 z" fill="none" stroke="#6a6a6e" stroke-width="1.2"/>
        <circle cx="52" cy="8" r="6" fill="none" stroke="#6a6a6e" stroke-width="1.2"/>
      </g>
    </g>

    <g transform="translate(16,44)">
      <text x="0" y="10" fill="#8a8a8e" font-size="10">5 小时</text>
      <rect x="52" y="3" width="150" height="6" rx="3" fill="#26262a"/>
      <rect x="52" y="3" width="63" height="6" rx="3" fill="#E86A4B"/>
      <text x="212" y="10" fill="#9a9a9e" font-size="10">42%</text>
      <text x="252" y="10" fill="#8a8a8e" font-size="10">7 天</text>
      <rect x="288" y="3" width="90" height="6" rx="3" fill="#26262a"/>
      <rect x="288" y="3" width="16" height="6" rx="3" fill="#E86A4B"/>
      <text x="388" y="10" fill="#9a9a9e" font-size="10">18%</text>
    </g>

    <g transform="translate(12,66)">
      <rect x="0" y="0" width="416" height="86" rx="10" fill="#1c1c1e" stroke="#E24B4A" stroke-opacity="0.5" stroke-width="1"/>
      <text x="12" y="20" fill="#ffffff" font-size="13" font-weight="600">⚠ 权限请求</text>
      <rect x="92" y="9" width="42" height="15" rx="7.5" fill="#FF9500"/>
      <text x="98" y="20" fill="#3a2400" font-size="10" font-family="monospace">Bash</text>
      <rect x="12" y="30" width="392" height="20" rx="6" fill="#0d0d0f"/>
      <text x="20" y="44" fill="#e6e6e6" font-size="11" font-family="monospace">npm run deploy --prod</text>
      <g transform="translate(12,58)">
        <rect x="0" y="0" width="64" height="20" rx="8" fill="#38383c"/>
        <text x="16" y="14" fill="#ffffff" font-size="11" font-weight="600">拒绝</text>
        <rect x="72" y="0" width="72" height="20" rx="8" fill="#ffffff"/>
        <text x="86" y="14" fill="#000000" font-size="11" font-weight="600">允许一次</text>
        <rect x="152" y="0" width="72" height="20" rx="8" fill="#3F72F2"/>
        <text x="166" y="14" fill="#ffffff" font-size="11" font-weight="600">始终允许</text>
        <text x="392" y="14" fill="#8a8a8e" font-size="10" text-anchor="end">⚡ 本会话自动批准</text>
      </g>
    </g>

    <g transform="translate(12,164)">
      <rect x="0" y="0" width="416" height="106" rx="10" fill="#1c1c1e"/>
      <circle cx="18" cy="18" r="6" fill="#FF9F0A"/>
      <text x="32" y="22" fill="#ffffff" font-size="13" font-weight="600">web-app</text>
      <text x="98" y="22" fill="#9a9a9e" font-size="12">· 添加登录页</text>
      <g transform="translate(12,34)">
        <rect x="0" y="0" width="46" height="16" rx="4" fill="#FF9F0A"/>
        <text x="8" y="12" fill="#3a2400" font-size="10" font-weight="600">Claude</text>
        <rect x="52" y="0" width="52" height="16" rx="4" fill="#26262a"/>
        <text x="60" y="12" fill="#9a9a9e" font-size="10">sonnet</text>
        <rect x="110" y="0" width="34" height="16" rx="4" fill="#26262a"/>
        <text x="118" y="12" fill="#9a9a9e" font-size="10">2 分</text>
        <rect x="330" y="0" width="62" height="16" rx="4" fill="#2a2118"/>
        <text x="361" y="12" fill="#FF9F0A" font-size="10" text-anchor="middle">运行工具</text>
      </g>
      <g transform="translate(12,58)" font-family="monospace">
        <text x="0" y="10" fill="#6a6a6e" font-size="10">·</text>
        <text x="10" y="10" fill="#d8944f" font-size="10">Bash</text>
        <text x="44" y="10" fill="#9a9a9e" font-size="10">npm test</text>
        <text x="10" y="24" fill="#6a6a6e" font-size="9">└ 3 passed</text>
      </g>
    </g>

    <g transform="translate(12,282)">
      <rect x="0" y="0" width="416" height="72" rx="10" fill="#1c1c1e"/>
      <circle cx="18" cy="18" r="6" fill="#598CFF"/>
      <text x="32" y="22" fill="#ffffff" font-size="13" font-weight="600">api-server</text>
      <text x="112" y="22" fill="#9a9a9e" font-size="12">· 修复超时</text>
