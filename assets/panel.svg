        <rect x="0" y="0" width="42" height="16" rx="4" fill="#598CFF"/>
        <text x="8" y="12" fill="#0a1c44" font-size="10" font-weight="600">Codex</text>
        <rect x="48" y="0" width="34" height="16" rx="4" fill="#26262a"/>
        <text x="56" y="12" fill="#9a9a9e" font-size="10">4 分</text>
        <rect x="352" y="0" width="40" height="16" rx="4" fill="#16301c"/>
        <text x="372" y="12" fill="#3ECf7f" font-size="10" text-anchor="middle">完成</text>
      </g>
